<html>
    <head>
        <title>About Animals</title>
        <style>
            body{
                background-color: rgb(16, 15, 13);
                font-family: Arial, Helvetica, sans-serif;
            }
            .fact-file{
                background-color: aquamarine;
                color: palegreen;
                width: 333;
                padding: 40px;
                border: 20px solid greenyellow;
                margin: auto;
            }

            .animal-name{
                color: black;
                font-size: small;
                font-size: larger;
            }

            .detail{
                color: rgb(20, 29, 123);
                font-size: larger;
            }

            .cool-fact{
                color: rgb(22, 125, 173);
                font-style: italic;
                font-size: larger;
            } 

        </style>
    </head>
    <body>

        <div class="fact-file">
            <h2 class="animal-name">Snow Leopard</h2>
            <p class="detail">type: Big Cat</p>
            <p class="detail">Lives in:Mountain ranges of Central Asia</p>
            <p class="detail">Diet: Deer, goats, and wild sheep</p>
            <p class="cool-fact">Cool Fact: Can leap up to 15 metres in one jump!</p>
        </div>
        
    </body>
</html>
