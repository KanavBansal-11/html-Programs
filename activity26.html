
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>My Phone Contact</title>

        <link
            href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
            rel="stylesheet">

        <style>
            body {
                background-color: green;
            }

            h1 {
                color: navy;
            }

            .card-label {
                font-size: 11px;
                color: blueviolet;
                text-transform: uppercase;
                display: block;
            }

            pre {
                font-size: 13px;
                color: #333;
            }
        </style>
    </head>

    <body class="py-4">
        <div class="container">

            <h1 class="mb-1">My Phone Contact</h1>

            <p class="text-muted mb-4">
                Introduction to Objects in JavaScript - Grade 4-6
            </p>

            <div class="card shadow-sm mb-3" style="max-width:400px;">
                <div class="card-body">

                    <h5 class="card-title" style="color: grey;">
                        Contact Details
                    </h5>

                    <ul class="list-group list-group-flush">

                        <li class="list-group-item">
                            <span class="card-label">Name</span>
                            <strong id="name">--</strong>
                        </li>

                        <li class="list-group-item">
                            <span class="card-label">Phone</span>
                            <strong id="phone">--</strong>
                        </li>

                        <li class="list-group-item">
                            <span class="card-label">School</span>
                            <strong id="school">--</strong>
                        </li>

                        <li class="list-group-item">
                            <span class="card-label">City</span>
                            <strong id="city">--</strong>
                        </li>

                    </ul>
                </div>
            </div>

            <div class="card shadow-sm" style="max-width:400px;">
                <div class="card-body">

                    <h6 style="color: beige;">
                        JavaScript Object Used
                    </h6>

                    <pre id="codeDisplay"
                         class="bg-light p-3 rounded border mb-0"></pre>

                </div>
            </div>

        </div>

        <script>
            var myContact = {
                name: "kanav Bansal",
                phone: "47223-42536",
                school: "Delhi Public School",
                city: "Bangaluru"
            };

            var nameE1 = document.getElementById("name");
            var phoneE1 = document.getElementById("phone");
            var schoolE1 = document.getElementById("school");
            var cityE1 = document.getElementById("city");

            nameE1.textContent = myContact.name;
            phoneE1.textContent = myContact.phone;
            schoolE1.textContent = myContact["school"];
            cityE1.textContent = myContact["city"];

            var codeE1 = document.getElementById("codeDisplay");

            codeE1.textContent =
                'var myContact = {\n' +
                '  name: "' + myContact.name + '",\n' +
                '  phone: "' + myContact.phone + '",\n' +
                '  school: "' + myContact.school + '",\n' +
                '  city: "' + myContact.city + '"\n' +
                '};';
        </script>

    </body>
</html>
