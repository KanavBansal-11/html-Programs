<html>
    <body>
        <h2>JavaScript Array Methods</h2>
        <h2>join() and pop()</h2>
        <p>The joins array elements into a string and the pop() method removes the last element from the array</p>
        <p id="myjoin"></p>
        <p id="myfirstpop"></p>
        <p id="mysecoundpop"></p>
        <script>
            var fruits = ["Banana","Orange","Apple","Mango"];
            document.getElementById("myjoin").innerHTML = fruits.join(" * ");
            document.getElementById("myfirstpop").innerHTML = fruits;
            fruits.pop();
            document.getElementById("mysecoundpop").innerHTML = fruits;

        </script>
    </body>
</html>
